---
layout: default
---
<div class="wrap page-body">
  <div class="page-nav">
    {%- include back_link.html -%}
  </div>

  <header class="page-head">
    <p class="eyebrow">{{ page.tags | first | default: 'Note' }}</p>
    <h1 class="page-head__title">{{ page.title }}</h1>
    <div class="page-head__meta">
      <time class="meta" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.theme_config.date_format }}</time>
      <span class="meta">{{ content | strip_html | number_of_words | divided_by: 200 | plus: 1 }} min read</span>
    </div>
  </header>

  <article class="prose">
    {{ content }}
  </article>
</div>
