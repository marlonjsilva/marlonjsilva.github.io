---
layout: default
---
<div class="wrap page-body">
  <div class="page-nav">
    {%- include back_link.html -%}
  </div>

  <header class="page-head">
    <p class="eyebrow">Everything</p>
    <h1 class="page-head__title">{{ page.title }}</h1>
    <div class="page-head__meta">
      <span class="meta">{{ site.posts.size }} post{% if site.posts.size != 1 %}s{% endif %}</span>
      <span class="meta">Newest first</span>
    </div>
  </header>

  {%- include post_list.html category=page.which_category -%}
</div>
